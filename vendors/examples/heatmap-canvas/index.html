<!DOCTYPE HTML>
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Highcharts Example</title>

		<style type="text/css">
:root {
    color-scheme: light dark;
}
body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        "Apple Color Emoji",
        "Segoe UI Emoji",
        "Segoe UI Symbol",
        sans-serif;
    background: var(--highcharts-background-color);
    color: var(--highcharts-neutral-color-100);
}

#csv {
    display: none;
}

.highcharts-figure {
    min-width: 360px;
    max-width: 1000px;
    margin: 1em auto;
}

.highcharts-description {
    background: light-dark(#f2f6f2, #323232);
    border-radius: 0 4px 4px 0;
    border-left: 2px solid light-dark(#1d6aff, #fff);
    font-size: 0.8rem;
    font-style: italic;
    padding: 8px 16px;
    margin: 2em 10px 1em;
}

@media (prefers-color-scheme: dark) {
    body {
        background-color: #141414;
        color: #ddd;
    }
    a {
        color: #2caffe;
    }
}
		</style>
	</head>
	<body>
<script src="../../code/highcharts.js"></script>
<script src="../../code/modules/heatmap.js"></script>
<script src="../../code/modules/exporting.js"></script>
<script src="../../code/modules/data.js"></script>
<script src="../../code/modules/boost-canvas.js"></script>
<script src="../../code/modules/boost.js"></script>
<script src="../../code/modules/accessibility.js"></script>

<figure class="highcharts-figure">
    <div id="container"></div>
    <p class="highcharts-description">
        Heatmap with over 8,500 points, visualizing hourly temperature in 2025.
        The blue colors indicate colder days, and the red colors indicate warmer
        days. Notice how we are able to find patterns in a large dataset using a
        compact heatmap, like when the Sun is up. This chart uses the Highcharts
        Boost module for enhanced performance.
    </p>
</figure>



		<script type="text/javascript">
(async () => {
    const csv = await fetch(
        // Source: https://p.vikjavev.no/ver/highcharts-demos/heatmap.csv.php?year=2025
        'https://cdn.jsdelivr.net/gh/highcharts/highcharts@5cd39e6abf/samples/data/large-heatmap.csv'
    ).then(res => res.text());

    const dataTable = new Highcharts.Data({ csv }).getDataTable();

    Highcharts.chart('container', {

        dataTable,

        chart: {
            type: 'heatmap'
        },

        boost: {
            useGPUTranslations: true
        },

        title: {
            text: 'Large heatmap',
            align: 'left',
            x: 40
        },

        subtitle: {
            text: 'Temperature variation by day and hour through 2025',
            align: 'left',
            x: 40
        },

        xAxis: {
            type: 'datetime',
            min: '2025-01-01',
            max: '2025-12-31 23:59:59',
            labels: {
                align: 'left',
                x: 5,
                y: 14,
                format: '{value:%B}' // long month
            },
            showLastLabel: false,
            tickLength: 16
        },

        yAxis: {
            title: {
                text: null
            },
            labels: {
                format: '{value}:00'
            },
            minPadding: 0,
            maxPadding: 0,
            startOnTick: false,
            endOnTick: false,
            tickPositions: [0, 6, 12, 18, 24],
            tickWidth: 1,
            min: 0,
            max: 23,
            reversed: true
        },

        colorAxis: {
            stops: [
                [0, '#3060cf'],
                [0.5, 'var(--highcharts-background-color)'],
                [0.9, '#fe6a35'],
                [1, '#c4463a']
            ],
            min: -15,
            max: 25,
            startOnTick: false,
            endOnTick: false,
            labels: {
                format: '{value}℃'
            }
        },

        series: [{
            dataMapping: {
                x: 'Date',
                y: 'Time',
                value: 'Temperature'
            },
            boostThreshold: 100,
            borderWidth: 0,
            nullColor: '#EFEFEF',
            colsize: 24 * 36e5, // One day
            tooltip: {
                headerFormat: 'Temperature<br/>',
                pointFormat: '{point.x:%e %b, %Y} {point.y}:00: ' +
                    '<b>{point.value} ℃</b>'
            }
        }]

    });
})();

		</script>
	</body>
</html>
